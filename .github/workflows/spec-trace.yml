name: spec-trace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run spec-trace
        run: python spec-trace check --repo-root .
      - name: Run spec-trace tests
        run: python -m unittest discover -s tests -v
